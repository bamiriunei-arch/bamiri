<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="吹奏楽・オーケストラ・バンドの舞台配置図をスマホやPCで作って画像にできる無料ツール">
<meta name="theme-color" content="#16191C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316191C'/%3E%3Crect x='6' y='13' width='20' height='7' rx='1' fill='%23E3B23C' transform='rotate(-10 16 16)'/%3E%3C/svg%3E">
<title>バミリ配置図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EDEFEC; --panel:#FFFFFF; --ink:#1B211F; --muted:#5C6662; --line:#D4D9D6;
  --chip:#F3F5F3; --chip-h:#E6EAE7; --accent:#E3B23C; --accent-ink:#1B1A14; --danger:#C2412F;
  --stagebg:#16191C;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#111315; --panel:#1A1D20; --ink:#E7EBE9; --muted:#9AA39F; --line:#2D3236;
    --chip:#22262A; --chip-h:#2C3136; --danger:#E0664F; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#111315; --panel:#1A1D20; --ink:#E7EBE9; --muted:#9AA39F; --line:#2D3236;
  --chip:#22262A; --chip-h:#2C3136; --danger:#E0664F; }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:14px}
.shell{height:100%; display:flex; flex-direction:column; padding-inline:16px; padding-block:12px; box-sizing:border-box; gap:10px}
header{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:8px}
.brand b{font-size:20px; letter-spacing:.04em}
.brand .tape{display:inline-block; width:22px; height:8px; background:var(--accent); transform:rotate(-8deg); border-radius:1px}
.brand small{color:var(--muted); font-size:12px}
.titleIn{flex:1 1 220px; min-width:0; font:inherit; font-weight:700; font-size:15px; background:transparent; color:var(--ink); border:1px solid transparent; border-radius:6px; padding:6px 8px}
.titleIn:hover,.titleIn:focus{border-color:var(--line); background:var(--panel); outline:none}
.hbtns{display:flex; gap:6px; flex-wrap:wrap}
button{font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer}
button:hover,.btnLink:hover{background:var(--chip-h)}
.btnLink{display:inline-flex; align-items:center; font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:6px 10px; text-decoration:none}
.btnLink:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
button:disabled{opacity:.4; cursor:default}
button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700}
button.primary:hover{filter:brightness(1.05)}
button.danger{color:var(--danger)}

.app{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:12px}
.stageCol{position:relative; min-height:0; display:flex; flex-direction:column; background:var(--stagebg); border-radius:10px; overflow:hidden}
.vp{flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch}
#svg{display:block; width:100%; height:auto; user-select:none; -webkit-user-select:none}
#svg .it{cursor:grab; touch-action:none}
#svg [data-handle]{cursor:alias; touch-action:none}
.ctl{position:absolute; top:8px; left:8px; right:8px; display:flex; gap:6px; flex-wrap:wrap; pointer-events:none}
.ctl > *{pointer-events:auto}
.ctl button,.selbar button{background:rgba(30,34,38,.88); color:#E7EBE9; border-color:#3a4046; padding:5px 9px; font-size:13px}
.ctl button:hover,.selbar button:hover{background:rgba(52,58,64,.95)}
.ctl button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.zoomv{font-family:var(--mono); color:#C9CFD3; font-size:12px; align-self:center; min-width:40px; text-align:center}
.spacer{flex:1}
.selbar{position:absolute; left:8px; right:8px; bottom:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.selbar .tag{background:var(--accent); color:var(--accent-ink); font-weight:700; border-radius:6px; padding:5px 10px; font-size:13px; max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.selbar button.danger{color:#F19A87}

aside{min-height:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.tabs{display:grid; grid-template-columns:repeat(5,1fr); border-bottom:1px solid var(--line)}
.tabs button{border:0; border-radius:0; background:transparent; padding:10px 2px; color:var(--muted); font-weight:500; border-bottom:2px solid transparent; font-size:13px; white-space:nowrap}
.ctl select{background:rgba(30,34,38,.88); color:#E7EBE9; border:1px solid #3a4046; border-radius:6px; font:inherit; font-size:13px; padding:5px 6px; max-width:150px}
.layers{display:flex; flex-direction:column; gap:6px}
.lyr{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:6px 6px 6px 8px; cursor:pointer}
.lyr.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--panel))}
.lyr.off{opacity:.55}
.lyr input.nm{font:inherit; font-weight:700; color:var(--ink); background:transparent; border:1px solid transparent; border-radius:5px; padding:4px 6px; min-width:0; width:100%; box-sizing:border-box}
.lyr input.nm:focus{border-color:var(--line); background:var(--chip); outline:none}
.lyr .meta{font-size:11px; color:var(--muted); padding-left:6px}
.lyr .btns{display:flex; gap:3px}
.ib{padding:4px 6px; line-height:0; background:transparent; border-color:transparent}
.ib svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--chip-h); border-color:var(--line)}
.ib.warn[aria-pressed="true"]{color:var(--danger)}
.radio{width:14px; height:14px; border-radius:50%; border:2px solid var(--muted); box-sizing:border-box}
.lyr.on .radio{border-color:var(--accent); background:radial-gradient(var(--accent) 45%, transparent 50%)}
.badge{font-size:11px; background:var(--accent); color:var(--accent-ink); border-radius:4px; padding:1px 6px; font-weight:700}
.target{display:flex; align-items:center; gap:8px; font-size:13px; background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
.target b{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bgThumb{width:100%; max-height:120px; object-fit:contain; background:var(--chip); border:1px solid var(--line); border-radius:6px}
input[type=range]{width:100%; accent-color:var(--accent)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:700}
.pane{flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:16px}
.grp h3{margin:0 0 8px; font-size:11px; letter-spacing:.12em; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px}
.dot{width:9px; height:9px; border-radius:2px; display:inline-block; border:1px solid rgba(0,0,0,.25)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chips button{padding:5px 9px; font-size:13px; display:inline-flex; align-items:center; gap:6px}
.hint{color:var(--muted); font-size:12px; line-height:1.6; margin:0}
.field{display:grid; grid-template-columns:88px 1fr; align-items:center; gap:8px}
.field label{color:var(--muted); font-size:12px}
.field input,.field select,textarea{font:inherit; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:6px; padding:6px 8px; min-width:0; width:100%; box-sizing:border-box}
.num{font-family:var(--mono)}
.row{display:flex; gap:6px; flex-wrap:wrap}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.counts{display:flex; flex-wrap:wrap; gap:4px}
.counts span{font-size:12px; background:var(--chip); border:1px solid var(--line); border-radius:4px; padding:2px 6px}
.counts span b{font-family:var(--mono); margin-left:4px}
.total{font-size:13px}
.total b{font-family:var(--mono); font-size:18px}
.saves{display:flex; flex-direction:column; gap:6px}
.save{display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:8px}
.save div{flex:1; min-width:0}
.save strong{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.save small{color:var(--muted); font-family:var(--mono); font-size:11px}
textarea{font-family:var(--mono); font-size:11px; height:90px; resize:vertical}
.check{display:flex; align-items:center; gap:8px}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#1B211F; color:#fff; padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30}
.toast.on{opacity:1}

.ov{position:fixed; inset:0; background:rgba(10,12,14,.72); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20}
.ov .card{background:var(--panel); color:var(--ink); border-radius:12px; max-width:960px; width:100%; max-height:100%; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px; box-sizing:border-box}
.ov img{width:100%; height:auto; border:1px solid var(--line); border-radius:6px; background:#fff}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.seg button{border:0; border-radius:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}

@media (max-width:820px){
  html,body{height:auto}
  .shell{height:auto}
  .app{display:flex; flex-direction:column}
  .stageCol{height:62vh; flex:none}
  aside{min-height:420px}
  .pane{overflow:visible}
}
.sheetOv{align-items:flex-end}
.sheetOv .card{max-width:560px; max-height:80vh; padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dirgrid{display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,52px); gap:6px; justify-content:center}
.dirgrid button{font-size:22px; padding:0}
.dirgrid .mid{font-size:12px; font-weight:700; background:var(--accent); color:var(--accent-ink); border-color:transparent}
.sheetHead{display:flex; align-items:center; gap:8px}
.sheetHead strong{flex:1; font-size:16px}
.warnNote{margin:0; font-size:13px; line-height:1.6; padding:8px 10px; border-radius:8px; background:color-mix(in srgb, var(--danger) 12%, var(--panel)); color:var(--ink); border:1px solid color-mix(in srgb, var(--danger) 40%, var(--line))}
.guide{max-width:560px}
.guide .step{font-family:var(--mono); font-size:12px; color:var(--muted)}
.guide h2{margin:0; font-size:20px; text-wrap:balance}
.guide ul{margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:6px; line-height:1.65}
.guide .dots{display:flex; gap:6px}
.guide .dots i{width:8px; height:8px; border-radius:50%; background:var(--line)}
.guide .dots i.on{background:var(--accent)}
.fbLink{color:var(--ink); font-weight:700}
.survey{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:360px; left:auto; background:var(--panel); color:var(--ink); border:1px solid var(--accent); border-radius:12px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:15; display:flex; flex-direction:column; gap:10px}
.survey p{margin:0; font-size:13px; line-height:1.6}
.primaryLink{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700}
@media (max-width:520px){.survey{left:16px; right:16px; max-width:none}}
.about{border-top:1px solid var(--line); padding-top:12px}
.about h3{margin:0 0 6px; font-size:12px; letter-spacing:.1em; color:var(--muted)}
.about ul{font-size:12.5px; color:var(--muted); gap:4px}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
<style>
:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0; font-size:14px; -webkit-text-size-adjust:100%}
img{max-width:100%}
</style>
</head>
<body>


<div class="shell">
  <header>
    <div class="brand"><span class="tape" aria-hidden="true"></span><b>バミリ</b><small>舞台配置図</small></div>
    <input id="title" class="titleIn" aria-label="公演名・タイトル" placeholder="公演名（画像の上に入ります）">
    <div class="hbtns">
      <button id="helpBtn">使い方</button>
      <a id="fbBtn" class="btnLink" href="https://forms.gle/HpXuHj7YCkBAsbGt9" target="_blank" rel="noopener">ご意見</a>
      <button id="undo" title="元に戻す (Ctrl+Z)">↶ 戻す</button>
      <button id="redo" title="やり直す (Ctrl+Y)">↷ 進む</button>
      <button id="exportBtn" class="primary">画像にする</button>
    </div>
  </header>

  <div class="app">
    <div class="stageCol">
      <div class="vp" id="vp"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="ctl">
        <button id="zout" aria-label="縮小">−</button>
        <span class="zoomv" id="zv">100%</span>
        <button id="zin" aria-label="拡大">＋</button>
        <button id="zfit">全体</button>
        <span class="spacer"></span>
        <select id="layerSel" aria-label="作業中のレイヤー"></select>
        <button id="multiBtn" aria-pressed="false" title="タップで追加選択・なぞって範囲選択">複数選択</button>
        <button id="snapBtn" aria-pressed="true" title="10cm・15°単位でそろえる">スナップ</button>
      </div>
      <div class="selbar" id="selbar" hidden>
        <span class="tag" id="selTag"></span>
        <button data-act="rotL" aria-label="左に15度回転">⟲</button>
        <button data-act="rotR" aria-label="右に15度回転">⟳</button>
        <button data-act="part" id="partBtn">パート</button>
        <button data-act="dir">向き</button>
        <button data-act="dup">複製</button>
        <button data-act="del" class="danger">削除</button>
        <button data-act="edit">詳細</button>
      </div>
    </div>

    <aside>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="add" aria-selected="true">追加</button>
        <button role="tab" data-tab="sel" aria-selected="false">選択中</button>
        <button role="tab" data-tab="layer" aria-selected="false">レイヤー</button>
        <button role="tab" data-tab="stage" aria-selected="false">ステージ</button>
        <button role="tab" data-tab="save" aria-selected="false">保存</button>
      </div>
      <div class="pane" id="pane-add"></div>
      <div class="pane" id="pane-sel" hidden></div>
      <div class="pane" id="pane-layer" hidden></div>
      <div class="pane" id="pane-stage" hidden></div>
      <div class="pane" id="pane-save" hidden></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="survey" id="survey" hidden role="region" aria-label="利用者アンケートのお願い">
  <p><b>バミリを使ってくれてありがとうございます</b><br>今後の改善のため、所属や使い方を教えてください（1分・任意・名前は不要）。</p>
  <div class="row"><a class="btnLink primaryLink" id="svGo" href="https://forms.gle/HpXuHj7YCkBAsbGt9" target="_blank" rel="noopener">アンケートに答える</a><button id="svLater">あとで</button><button id="svNever">今後表示しない</button></div>
</div>
<div class="ov" id="guide" hidden><div class="card guide" role="dialog" aria-modal="true" aria-labelledby="gTitle" id="guideBody"></div></div>
<div class="ov sheetOv" id="sheet" hidden><div class="card" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div class="ov" id="ov" hidden>
  <div class="card">
    <div class="row" style="align-items:center">
      <strong style="font-size:16px">画像として書き出し</strong><span class="spacer" style="flex:1"></span>
      <button id="ovClose">閉じる</button>
    </div>
    <div class="row" style="align-items:center">
      <div class="seg"><button id="mDark" aria-pressed="true">黒ステージ</button><button id="mPrint" aria-pressed="false">白（印刷向け）</button></div>
      <label class="check"><input type="checkbox" id="oCounts" checked> 編成を入れる</label>
      <label class="check"><input type="checkbox" id="oNames" checked> 奏者名を入れる</label>
      <label class="check" id="oBgWrap"><input type="checkbox" id="oBg" checked> 背景画像を入れる</label>
    </div>
    <p class="warnNote" id="nameWarn" hidden>奏者名が入っています。生徒などの名前入りの画像は、SNSや誰でも見られる場所には載せないでください。</p>
    <img id="outImg" alt="書き出した配置図">
    <div class="row" style="align-items:center">
      <p class="hint" style="flex:1">「画像を保存」で保存できます。スマホは画像の長押しでも保存できます。</p>
      <button id="dlImg" class="primary" hidden>画像を保存</button>
      <button id="copyImg">画像をコピー</button>
    </div>
    <div class="row" style="align-items:center">
      <p class="hint" style="flex:1">よければ <a class="fbLink" id="svLink2" href="https://forms.gle/HpXuHj7YCkBAsbGt9" target="_blank" rel="noopener">利用者アンケート（1分・任意）</a> にもご協力ください。今後の改善に使います。</p>
    </div>
  </div>
</div>

<script>
(()=>{
const STANDALONE=true; // Claude外に置く版ではtrue（ファイル保存が使える）
const K='#15181B', STAND='#DFE4EA';
const FONT="'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif";
const SEC={
  ww:{n:'木管',c:'#86BDEB'}, br:{n:'金管',c:'#F2C14E'}, str:{n:'弦',c:'#8FD3A0'},
  perc:{n:'打楽器',c:'#EE8A7A'}, key:{n:'鍵盤',c:'#C7A6EC'}, band:{n:'バンド',c:'#F5A45D'},
  cond:{n:'指揮',c:'#F4F4F2'}, gear:{n:'機材',c:'#A9B2BC'}, etc:{n:'その他',c:'#E4D8C4'}
};
const T={
  player:{n:'奏者（椅子）',w:46,h:46,sec:'ww',label:'Fl'},
  standing:{n:'奏者（立ち）',w:50,h:50,sec:'band',label:'Vo'},
  conductor:{n:'指揮台',w:90,h:90,sec:'cond',label:'指揮'},
  stand:{n:'譜面台',w:54,h:10,sec:'gear',label:''},
  circle:{n:'打楽器（丸）',w:72,h:72,sec:'perc',label:'Timp'},
  bd:{n:'大太鼓',w:90,h:55,sec:'perc',label:'B.D.'},
  mallet:{n:'鍵盤打楽器',w:250,h:90,sec:'perc',label:'Mar'},
  drums:{n:'ドラムセット',w:190,h:160,sec:'band',label:'Dr'},
  piano:{n:'グランドピアノ',w:150,h:240,sec:'key',label:'Pf'},
  keyboard:{n:'キーボード',w:140,h:45,sec:'key',label:'Key'},
  amp:{n:'アンプ',w:70,h:40,sec:'gear',label:'Amp'},
  wedge:{n:'モニター',w:66,h:46,sec:'gear',label:'Mon'},
  mic:{n:'マイク',w:28,h:28,sec:'gear',label:'Mic'},
  riser:{n:'平台',w:182,h:91,sec:'etc',label:'平台'},
  box:{n:'四角',w:120,h:60,sec:'etc',label:'机'},
  text:{n:'テキスト',w:200,h:30,sec:'etc',label:'テキスト'},
  stairs:{n:'階段',w:180,h:90,sec:'etc',label:'階段'},
  arrow:{n:'矢印',w:200,h:20,sec:'etc',label:''},
  line:{n:'線',w:300,h:6,sec:'etc',label:''}
};
const SECMAP={
  ww:['Pic','Fl','Ob','E.H.','Fg','C.Fg','E♭Cl','Cl','Cl1','Cl2','Cl3','A.Cl','B.Cl','S.Sax','A.Sax','T.Sax','B.Sax'],
  br:['Tp','Cor','Hn','Tb','B.Tb','Euph','Tuba'],
  str:['Vn1','Vn2','Va','Vc','Cb','St.B','Hp'],
  perc:['Perc','Timp'], key:['Pf','Cel'], band:['Vo','Gt','Ba','Key','Dr','Cho']
};
const secOf=l=>{for(const k in SECMAP) if(SECMAP[k].includes(l)) return k; return null};

function mk(t,label,x,y,ex={}){
  const d=T[t];
  const sec=ex.sec||((t==='player'||t==='standing')?(secOf(label)||d.sec):d.sec);
  return Object.assign({id:uid(),t,x:Math.round(x),y:Math.round(y),r:0,label:label??d.label,name:'',sec,w:d.w,h:d.h},ex,{sec});
}
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const faceAngle=(x,y,cx,cy)=>Math.round(deg(Math.atan2(-(cx-x),(cy-y))));
function arcRow(labels,r,sp,cx,cy,off=0){
  const n=labels.length, span=sp*(n-1)/r, a0=rad(off)-span/2;
  return labels.map((l,i)=>{const a=n>1?a0+span*i/(n-1):rad(off);
    const it=mk('player',l,cx+r*Math.sin(a),cy-r*Math.cos(a)); it.r=Math.round(deg(a)); return it;});
}
function fan(l,n,r,a0,a1,cx,cy){
  const out=[]; for(let i=0;i<n;i++){const a=rad(n>1?a0+(a1-a0)*i/(n-1):(a0+a1)/2);
    const it=mk('player',l,cx+r*Math.sin(a),cy-r*Math.cos(a)); it.r=Math.round(deg(a)); out.push(it);} return out;
}
function risersArc(r,a0,a1,cx,cy,label){
  const L=r*rad(a1-a0), n=Math.ceil(L/182), out=[];
  for(let i=0;i<n;i++){const a=rad(a0+(a1-a0)*(i+.5)/n);
    const it=mk('riser',label,cx+r*Math.sin(a),cy-r*Math.cos(a)); it.r=Math.round(deg(a)); out.push(it);} return out;
}

/* layers */
const isPlayer=i=>i.t==='player'||i.t==='standing'||i.t==='conductor';
function withLayers(d){
  const Ls=[{id:uid(),name:'平台',vis:true,lock:true},{id:uid(),name:'打楽器・機材',vis:true,lock:false},{id:uid(),name:'奏者',vis:true,lock:false}];
  const of=i=>i.t==='riser'?0:isPlayer(i)?2:1;
  d.items.forEach(i=>i.layer=Ls[of(i)].id);
  d.layers=d.items.length?Ls:[{id:uid(),name:'レイヤー1',vis:true,lock:false}];
  d.active=d.layers[d.layers.length-1].id; return d;
}
function fixDoc(d){
  if(!Array.isArray(d.layers)||!d.layers.length) d.layers=[{id:uid(),name:'レイヤー1',vis:true,lock:false}];
  const ids=new Set(d.layers.map(l=>l.id)), top=d.layers[d.layers.length-1].id;
  d.items.forEach(i=>{if(!ids.has(i.layer)) i.layer=top;});
  if(!ids.has(d.active)) d.active=top;
  if(d.showNames===undefined) d.showNames=true;
  if(d.solo===undefined) d.solo=true;
  if(d.bg===undefined) d.bg=null;
  return d;
}
function fromPreset(k){const d=withLayers(PRESETS[k].f()); d.bg=null; return fixDoc(d);}

let doc=LS.get('bamiri.current');
doc=(!doc||!Array.isArray(doc.items))?fromPreset('wind'):fixDoc(doc);

let sel=null, sels=new Set(), multiMode=false, snap=true, zoom=1, past=[], future=[], last=JSON.stringify(doc);

const autosave=()=>{ if(!LS.set('bamiri.current',doc)) toast('ブラウザの保存容量がいっぱいです'); };
const layerOf=it=>doc.layers.find(l=>l.id===it.layer);
const activeLayer=()=>doc.layers.find(l=>l.id===doc.active);
function editable(it){const L=layerOf(it); return !!L&&L.vis&&!L.lock&&(!doc.solo||it.layer===doc.active);}
function setBgSrc(s){bgSrc=s; try{localStorage.setItem('bamiri.bgsrc',s||'')}catch(e){toast('画像が大きすぎてブラウザに保存できません（表示はできます）');}}
function commit(){const s=JSON.stringify(doc); if(s===last) return; past.push(last); if(past.length>100) past.shift(); last=s; future=[]; autosave(); updHist();}
function restore(s){doc=JSON.parse(s); last=s; pruneSel(); autosave(); renderAll();}
function undo(){if(!past.length) return; future.push(last); restore(past.pop()); updHist();}
function redo(){if(!future.length) return; past.push(last); restore(future.pop()); updHist();}
function updHist(){$('#undo').disabled=!past.length; $('#redo').disabled=!future.length;}
const get=id=>doc.items.find(i=>i.id===id);
const cond=()=>doc.items.find(i=>i.t==='conductor');

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const em=s=>[...String(s)].reduce((a,c)=>a+(c.charCodeAt(0)<256?.6:1),0);
const fit=(s,w,max)=>{const e=em(s); return e?Math.min(max,(w-8)/e):max};
const f1=n=>Math.round(n*10)/10;

function shape(it,P){
  const {w,h}=it, c=it.col||(SEC[it.sec]||SEC.etc).c, hw=w/2, hh=h/2, ink=it.col||P.text;
  switch(it.t){
    case 'player': return `<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" rx="9" fill="${c}" stroke="${K}" stroke-width="1.5"/>
      <rect x="${-hw+3}" y="${-hh+3}" width="${w-6}" height="7" rx="3" fill="rgba(0,0,0,.28)"/>${it.v==='nostand'?'':`
      <line x1="0" y1="${hh}" x2="0" y2="${hh+7}" stroke="${STAND}" stroke-width="2"/>
      <rect x="-27" y="${hh+7}" width="54" height="6" rx="2" fill="${STAND}" stroke="${K}"/>`}`;
    case 'standing': return `<circle r="${hw}" fill="${c}" stroke="${K}" stroke-width="1.5"/>
      <path d="M -8 ${hh+3} L 8 ${hh+3} L 0 ${hh+12} Z" fill="${c}" stroke="${K}"/>`;
    case 'conductor': return `<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" rx="4" fill="${P.podium}" stroke="${K}" stroke-width="1.5"/>
      <rect x="-30" y="${-hh-16}" width="60" height="6" rx="2" fill="${STAND}" stroke="${K}"/>
      <circle cy="6" r="19" fill="${c}" stroke="${K}" stroke-width="1.5"/>`;
    case 'stand': return `<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" rx="2" fill="${STAND}" stroke="${K}"/>`;
    case 'circle': {
      let s=`<circle r="${hw}" fill="${c}" stroke="${K}" stroke-width="1.5"/>`;
      if(it.v==='ring') s+=`<circle r="${Math.max(hw-6,2)}" fill="none" stroke="${K}" stroke-opacity=".45"/>`;
      if(it.v==='flower'){s=''; for(let k=0;k<6;k++){const t=k*Math.PI/3; s+=`<circle cx="${f1(Math.cos(t)*hw*.5)}" cy="${f1(Math.sin(t)*hw*.5)}" r="${f1(hw*.45)}" fill="${c}" stroke="${K}"/>`;} s+=`<circle r="${f1(hw*.3)}" fill="#F2D98C" stroke="${K}"/>`;}
      if(it.v==='cym') s+=`<circle r="${hw*.62}" fill="none" stroke="${K}" stroke-opacity=".4"/><circle r="${hw*.14}" fill="${K}" fill-opacity=".5"/>`;
      return s;}
    case 'bd': return `<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" rx="6" fill="${c}" stroke="${K}" stroke-width="1.5"/>
      <line x1="${-hw+7}" y1="${-hh+3}" x2="${-hw+7}" y2="${hh-3}" stroke="${K}" stroke-width="3"/>
      <line x1="${hw-7}" y1="${-hh+3}" x2="${hw-7}" y2="${hh-3}" stroke="${K}" stroke-width="3"/>`;
    case 'mallet': {
      let s=`<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" rx="4" fill="${c}" stroke="${K}" stroke-width="1.5"/>`;
      if(it.v==='chime'){const n=Math.max(4,Math.round(w/16)); for(let i=0;i<n;i++){const x=-hw+10+i*(w-20)/(n-1); s+=`<circle cx="${f1(x)}" cy="${-hh+12}" r="4" fill="none" stroke="${K}" stroke-opacity=".5"/>`;}}
      else {const n=Math.max(6,Math.min(44,Math.round(w/9))); for(let i=0;i<n;i++){const x=-hw+6+i*(w-12)/(n-1), yb=hh-6-(i/(n-1))*h*.35;
        s+=`<line x1="${f1(x)}" y1="${-hh+6}" x2="${f1(x)}" y2="${f1(yb)}" stroke="${K}" stroke-opacity=".35" stroke-width="2"/>`;}}
      return s;}
    case 'drums': {
      const sx=w/190, sy=h/160, C=(x,y,r,f)=>`<circle cx="${f1(x*sx)}" cy="${f1(y*sy)}" r="${f1(r*Math.min(sx,sy))}" fill="${f||'#E9EDF1'}" stroke="${K}"/>`;
      return `<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" rx="10" fill="${c}" fill-opacity=".22" stroke="${c}" stroke-dasharray="6 5"/>
        ${C(0,-60,15,P.podium)}<rect x="${f1(-22*sx)}" y="${f1(-15*sy)}" width="${f1(44*sx)}" height="${f1(62*sy)}" rx="5" fill="${c}" stroke="${K}"/>
        ${C(-28,-28,17)}${C(-66,-38,18,'#F2D98C')}${C(-20,-2,13)}${C(20,-2,14)}${C(42,-38,22)}${C(-62,24,24,'#F2D98C')}${C(66,16,26,'#F2D98C')}`;}
    case 'piano': {
      const sx=w/150, sy=h/240;
      return `<g transform="scale(${f1(sx*100)/100} ${f1(sy*100)/100})">
        <path d="M -75 -120 H 75 V -30 C 75 30 40 40 25 80 C 15 110 0 120 -20 120 H -75 Z" fill="${c}" stroke="${K}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        <rect x="-72" y="-118" width="144" height="20" fill="#F4F4F2" stroke="${K}" vector-effect="non-scaling-stroke"/>
        <rect x="-35" y="-150" width="70" height="22" rx="3" fill="${P.podium}" stroke="${K}" vector-effect="non-scaling-stroke"/></g>`;}
    case 'keyboard': {
      let s=`<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" rx="3" fill="${c}" stroke="${K}" stroke-width="1.5"/>
        <rect x="${-hw+4}" y="${-hh+4}" width="${w-8}" height="${Math.max(h*.45,6)}" fill="#F4F4F2" stroke="${K}" stroke-opacity=".5"/>`;
      for(let x=-hw+12;x<hw-6;x+=9) s+=`<line x1="${f1(x)}" y1="${-hh+4}" x2="${f1(x)}" y2="${f1(-hh+4+h*.28)}" stroke="${K}" stroke-width="3"/>`;
      return s;}
    case 'amp': return `<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" rx="3" fill="${c}" stroke="${K}" stroke-width="1.5"/>
      <rect x="${-hw+5}" y="${hh-Math.min(12,h*.4)}" width="${w-10}" height="${Math.min(8,h*.3)}" fill="rgba(0,0,0,.45)"/>`;
    case 'wedge': return `<path d="M ${-hw} ${hh} L ${hw} ${hh} L ${f1(w*.32)} ${-hh} L ${f1(-w*.32)} ${-hh} Z" fill="${c}" stroke="${K}" stroke-width="1.5"/>
      <line x1="${f1(-w*.26)}" y1="${f1(-hh+6)}" x2="${f1(w*.26)}" y2="${f1(-hh+6)}" stroke="${K}" stroke-width="3" stroke-opacity=".5"/>`;
    case 'mic': return `<circle r="${hw}" fill="${c}" stroke="${K}" stroke-width="1.5"/>
      <line x1="${-hw*.6}" y1="0" x2="${hw*.6}" y2="0" stroke="${K}"/><line x1="0" y1="${-hw*.6}" x2="0" y2="${hw*.6}" stroke="${K}"/>`;
    case 'riser': return `<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" fill="${P.riserFill}" stroke="${P.riserStroke}" stroke-width="2"/>
      <rect x="${-hw+6}" y="${-hh+6}" width="${Math.max(w-12,1)}" height="${Math.max(h-12,1)}" fill="none" stroke="${P.riserStroke}" stroke-opacity=".45" stroke-dasharray="4 4"/>
      <text y="${hh-10}" font-size="11" text-anchor="middle" fill="${P.dim}" font-family="${FONT}">${esc(it.label)}</text>`;
    case 'box': return `<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" rx="4" fill="${c}" stroke="${K}" stroke-width="1.5"/>`;
    case 'stairs': {let s=`<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" fill="${c}" stroke="${K}" stroke-width="1.5"/>`;
      const n=Math.max(2,Math.round(h/25)); for(let k=1;k<n;k++){const y=-hh+h*k/n; s+=`<line x1="${-hw}" y1="${f1(y)}" x2="${hw}" y2="${f1(y)}" stroke="${K}" stroke-opacity=".5"/>`;}
      return s;}
    case 'arrow': {const sw=Math.max(3,h*.3), hl=Math.min(w*.4,Math.max(18,h*1.2));
      return `<rect x="${-hw}" y="${-hh}" width="${w}" height="${h}" fill="transparent"/><line x1="${-hw}" y1="0" x2="${f1(hw-hl*.6)}" y2="0" stroke="${ink}" stroke-width="${f1(sw)}" stroke-linecap="round"/>

    case 'line': return `<rect x="${-hw}" y="${-Math.max(hh,8)}" width="${w}" height="${Math.max(h,16)}" fill="transparent"/><line x1="${-hw}" y1="0" x2="${hw}" y2="0" stroke="${ink}" stroke-width="${Math.max(2,h)}" ${it.v==='dash'?`stroke-dasharray="${h*3+6} ${h*2+6}"`:''}/>`;
    default: return '';

}
function lum(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return 1; const n=parseInt(m[1],16), f=v=>{v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}; return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255);}
const onInk=it=>it.col&&lum(it.col)<.28?'#FFFFFF':K;
function textW(it){return Math.max(40,em(it.label)*it.h+10)}
function bbox(it){return it.t==='text'?{w:textW(it),h:it.h+10}:{w:it.w,h:it.h}}

function labelSvg(it,P,names){
  let s='';
  if(it.t==='text') return `<text font-size="${it.h}" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="${it.col||P.text}" font-family="${FONT}">${esc(it.label)}</text>`;
  if(it.t!=='riser' && it.label){
    const max=it.t==='player'||it.t==='standing'?15:it.t==='conductor'?13:18;
    let fs=fit(it.label,Math.min(it.w,it.t==='drums'?120:it.w),max);
    if(fs<10||it.t==='arrow'||it.t==='line'){const R=(it.t==='arrow'||it.t==='line')?Math.max(it.h/2,8)+4:Math.hypot(it.w,it.h)/2;
      s+=`<text y="${f1(R+13)}" font-size="12" font-weight="700" text-anchor="middle" fill="${P.text}" font-family="${FONT}">${esc(it.label)}</text>`;}
    else{const dy=it.t==='piano'?it.h*.12:0;
      s+=`<text y="${f1(dy)}" font-size="${f1(fs)}" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="${onInk(it)}" font-family="${FONT}">${esc(it.label)}</text>`;}
  }
  if(names&&it.name){const y=it.t==='player'?it.h/2+27:Math.hypot(it.w,it.h)/2+14;
    s+=`<text y="${f1(y)}" font-size="12" text-anchor="middle" fill="${P.text}" font-family="${FONT}">${esc(it.name)}</text>`;}

}
function orderItems(L){const its=doc.items.filter(i=>i.layer===L.id); return [...its.filter(i=>i.t==='riser'),...its.filter(i=>i.t!=='riser')]}
const bgH=b=>b.w*b.ar;

function stageSvg(P,{screen=false,names=true,counts=false,bg=true}={}){
  const W=doc.W,D=doc.D, B=(bg&&doc.bg&&doc.bg.vis&&bgSrc)?doc.bg:null;
  let s='';
  const head=screen?0:(doc.title||counts?(counts?150:90):0);
  let ax0=-90,ay0=-80,ax1=W+90,ay1=D+130;
  if(B){ax0=Math.min(ax0,B.x-20); ay0=Math.min(ay0,B.y-20); ax1=Math.max(ax1,B.x+B.w+20); ay1=Math.max(ay1,B.y+bgH(B)+20);}
  const x0=ax0,y0=ay0-head,vw=ax1-ax0,vh=ay1-ay0+head;
  s+=`<rect x="${x0}" y="${y0}" width="${vw}" height="${vh}" fill="${P.wrap}"/>`;
  s+=`<rect x="0" y="0" width="${W}" height="${D}" fill="${P.floor}"/>`;
  if(B){const drag=screen&&!B.lock;
    s+=`<image ${drag?'data-bg="1" style="cursor:move;touch-action:none"':'pointer-events="none"'} href="${bgSrc}" xlink:href="${bgSrc}" x="${B.x}" y="${B.y}" width="${B.w}" height="${f1(bgH(B))}" opacity="${B.op}" preserveAspectRatio="none"/>`;
    if(drag) s+=`<rect x="${B.x}" y="${B.y}" width="${B.w}" height="${f1(bgH(B))}" fill="none" stroke="#E3B23C" stroke-width="2" stroke-dasharray="10 6" pointer-events="none"/>`;}
  s+=`<g pointer-events="none">`;
  for(let x=W/2%100;x<=W;x+=100){const k=Math.round((x-W/2)/100); s+=`<line x1="${f1(x)}" y1="0" x2="${f1(x)}" y2="${D}" stroke="${k%5===0?P.grid5:P.grid}"/>`;}
  for(let k=1;k*100<D;k++){const y=D-k*100; s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${k%5===0?P.grid5:P.grid}"/>`;}
  s+=`<line x1="${W/2}" y1="0" x2="${W/2}" y2="${D}" stroke="${P.center}" stroke-opacity=".55" stroke-dasharray="14 10"/>`;
  s+=`<rect x="0" y="0" width="${W}" height="${D}" fill="none" stroke="${P.edge}" stroke-width="3"/>`;
  const fs=`font-family="${FONT}"`;
  for(let k=-Math.floor(W/200);k<=Math.floor(W/200);k++){const x=W/2+k*100;
    s+=`<line x1="${x}" y1="${D}" x2="${x}" y2="${D+14}" stroke="${k===0?P.center:P.dim}" stroke-width="${k===0?3:1.5}"/>`;
    s+=`<text x="${x}" y="${D+32}" font-size="13" text-anchor="middle" fill="${k===0?P.center:P.dim}" font-family="'IBM Plex Mono',monospace" font-weight="${k===0?700:400}">${Math.abs(k)}</text>`;}
  s+=`<text x="10" y="-22" font-size="20" font-weight="700" fill="${P.dim}" ${fs}>下手</text>`;
  s+=`<text x="${W-10}" y="-22" font-size="20" font-weight="700" text-anchor="end" fill="${P.dim}" ${fs}>上手</text>`;
  s+=`<text x="${W/2}" y="${D+78}" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="8" fill="${P.text}" ${fs}>客 席</text>`;
  s+=`<path d="M ${W/2-120} ${D+70} l 14 8 l 14 -8 M ${W/2+92} ${D+70} l 14 8 l 14 -8" fill="none" stroke="${P.dim}" stroke-width="2"/>`;
  s+=`<text x="${W}" y="${D+78}" font-size="13" text-anchor="end" fill="${P.dim}" font-family="'IBM Plex Mono',monospace">${(W/100).toFixed(1)} × ${(D/100).toFixed(1)} m</text>`;
  s+=`<text x="0" y="${D+78}" font-size="13" fill="${P.dim}" ${fs}>目盛 = センターから m</text></g>`;

  for(const L of doc.layers){ if(!L.vis) continue;
    const dim=screen&&doc.solo&&L.id!==doc.active;
    if(dim) s+=`<g opacity=".38">`;
    for(const it of orderItems(L)){
      const live=screen&&editable(it);
      const hit=live?`<rect x="${-it.w/2-10}" y="${-it.h/2-10}" width="${it.w+20}" height="${it.h+20}" fill="transparent"/>`:'';
      const b=bbox(it);
      const hitT=live&&it.t==='text'?`<rect x="${-b.w/2}" y="${-b.h/2}" width="${b.w}" height="${b.h}" fill="transparent"/>`:'';
      s+=`<g ${live?`class="it" data-id="${it.id}"`:(screen?'pointer-events="none"':'')} transform="translate(${it.x} ${it.y})"><g transform="rotate(${it.r||0})">${it.t==='text'?hitT:hit}${shape(it,P)}</g>${labelSvg(it,P,names)}</g>`;
    }

  }

      s+=`<g transform="translate(${it.x} ${it.y}) rotate(${it.r||0})" pointer-events="none"><rect x="${-b.w/2-7}" y="${-b.h/2-7}" width="${b.w+14}" height="${b.h+14}" rx="6" fill="${sels.size>1?'rgba(227,178,60,.12)':'none'}" stroke="#E3B23C" stroke-width="2.5" stroke-dasharray="8 5"/></g>`;}
    const it=sels.size===1&&get(sel);
    if(it){const b=bbox(it), hy=-b.h/2-38;
    s+=`<g transform="translate(${it.x} ${it.y}) rotate(${it.r||0})" pointer-events="none">
      <line x1="0" y1="${-b.h/2-7}" x2="0" y2="${hy}" stroke="#E3B23C" stroke-width="2"/></g>
      <g data-handle="1" transform="translate(${it.x} ${it.y}) rotate(${it.r||0}) translate(0 ${hy})"><circle r="26" fill="transparent"/><circle r="11" fill="#E3B23C" stroke="${K}" stroke-width="1.5"/>
      <path d="M -5 -1 A 5 5 0 1 1 0 5" fill="none" stroke="${K}" stroke-width="1.6"/></g>`;}}
  if(screen) s+=`<rect id="marq" x="0" y="0" width="0" height="0" fill="rgba(227,178,60,.15)" stroke="#E3B23C" stroke-width="2" stroke-dasharray="6 4" pointer-events="none" visibility="hidden"/>`;

  if(!screen&&head){
    s+=`<text x="0" y="${-80-head+56}" font-size="40" font-weight="700" fill="${P.text}" ${fs}>${esc(doc.title||'')}</text>`;
    if(counts){const {list,total}=tally(); let line='',y=-80-head+100, lines=[];
      const parts=[`計 ${total}名`,...list.map(([l,n])=>`${l} ${n}`)];
      for(const p of parts){const t=line?line+'　'+p:p; if(em(t)*17>vw-200&&line){lines.push(line); line=p;} else line=t;}
      if(line) lines.push(line);
      lines.slice(0,2).forEach((ln,i)=>{s+=`<text x="0" y="${y+i*26}" font-size="17" fill="${P.dim}" ${fs}>${esc(ln)}</text>`;});}
  }
  return {s,vb:`${x0} ${y0} ${vw} ${vh}`,vw,vh};
}
function tally(){

}

/* ---------- render ---------- */
const $=q=>document.querySelector(q), svg=$('#svg'), vp=$('#vp');

function selectMany(ids,add=false){ if(!add) sels=new Set(); ids.forEach(i=>sels.add(i)); sel=ids.length?ids[ids.length-1]:(sels.size?[...sels].pop():null); draw(); renderSel(); if(sels.size>1) toast(`${sels.size}個を選択しました`); }

/* ---------- sheets: direction & part ---------- */

function openDir(){
  const its=selItems(); if(!its.length) return; const base=get(sel);
  const A=[['↖',135],['↑',180],['↗',-135],['←',90],null,['→',-90],['↙',45],['↓',0],['↘',-45]];

}
function openPart(){

  const groups=PAL.map(g=>({g:g.g,sec:g.sec,items:g.items.filter(x=>(x[0]==='player'||x[0]==='standing')&&x[1]&&x[1]!=='未定').map(x=>({l:x[1],sec:(x[2]&&x[2].sec)||secOf(x[1])||g.sec}))})).filter(g=>g.items.length);

svg.addEventListener('dblclick',e=>{const g=e.target.closest('[data-id]'); if(g&&isPart(get(g.dataset.id))) openPart();});

/* ---------- pointer ---------- */
function pt(e){const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse());}
let drag=null, justDragged=false;
const additive=e=>multiMode||e.shiftKey||e.ctrlKey||e.metaKey;
svg.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  if(aimMode){ const p=pt(e); const its=selItems(); its.forEach(i=>i.r=faceAngle(i.x,i.y,p.x,p.y)); aimMode=false; svg.style.cursor='';
    commit(); draw(); renderSel(); toast(`${its.length}個をその点に向けました`); justDragged=true; setTimeout(()=>justDragged=false,0); e.preventDefault(); return; }
  const h=e.target.closest('[data-handle]'), g=e.target.closest('[data-id]');
  const bgEl=e.target.closest('[data-bg]');
  const p=pt(e);
  if(h&&sel){ drag={mode:'rot',id:sel,moved:false}; }
  else if(g){ const id=g.dataset.id, add=additive(e), was=sels.has(id);
    if(add){ if(!was) select(id,true); }
    else if(!was) select(id);
    else sel=id;
    const group=selItems();
    drag={mode:'move',id,add,was,sx:e.clientX,sy:e.clientY,px:p.x,py:p.y,moved:false,start:group.map(i=>[i,i.x,i.y])}; }
  else if(bgEl&&doc.bg&&!multiMode){ drag={mode:'bg',dx:p.x-doc.bg.x,dy:p.y-doc.bg.y,sx:e.clientX,sy:e.clientY,moved:false}; }
  else if(e.pointerType==='mouse'||multiMode){ drag={mode:'box',x0:p.x,y0:p.y,sx:e.clientX,sy:e.clientY,moved:false,add:additive(e)}; }
  else return;

});
svg.addEventListener('pointermove',e=>{
  if(!drag) return; const p=pt(e);
  if(!drag.moved&&drag.mode!=='rot'&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4) return;
  if(drag.mode==='box'){ drag.moved=true; drag.x1=p.x; drag.y1=p.y; const m=$('#marq');
    if(m){m.setAttribute('x',Math.min(drag.x0,p.x)); m.setAttribute('y',Math.min(drag.y0,p.y)); m.setAttribute('width',Math.abs(p.x-drag.x0)); m.setAttribute('height',Math.abs(p.y-drag.y0)); m.setAttribute('visibility','visible');}
    return; }
  if(drag.mode==='bg'){
    drag.moved=true; let x=p.x-drag.dx, y=p.y-drag.dy; if(snap){x=Math.round(x/10)*10; y=Math.round(y/10)*10;}
    doc.bg.x=Math.round(x); doc.bg.y=Math.round(y); drawSoon(); return;
  }
  const it=get(drag.id); if(!it) return;
  if(drag.mode==='move'){
    drag.moved=true;
    const lead=drag.start.find(s=>s[0]===it)||[it,it.x,it.y];
    let nx=lead[1]+(p.x-drag.px), ny=lead[2]+(p.y-drag.py);
    if(snap){nx=Math.round(nx/10)*10; ny=Math.round(ny/10)*10;}
    const dx=nx-lead[1], dy=ny-lead[2];
    for(const [i,x,y] of drag.start){i.x=Math.round(x+dx); i.y=Math.round(y+dy);}
  } else { drag.moved=true; let a=deg(Math.atan2(p.x-it.x,-(p.y-it.y))); a=snap?Math.round(a/15)*15:Math.round(a); it.r=norm(a); }

});
const norm=a=>{a=((a%360)+360)%360; return a>180?a-360:a};
function endDrag(){
  const d=drag; drag=null; if(!d) return;
  if(d.mode==='box'){ const m=$('#marq'); if(m) m.setAttribute('visibility','hidden');
    if(d.moved){ const x0=Math.min(d.x0,d.x1),x1=Math.max(d.x0,d.x1),y0=Math.min(d.y0,d.y1),y1=Math.max(d.y0,d.y1);
      const ids=doc.items.filter(i=>editable(i)&&i.x>=x0&&i.x<=x1&&i.y>=y0&&i.y<=y1).map(i=>i.id);
      selectMany(ids,d.add); justDragged=true; setTimeout(()=>justDragged=false,0);}
    return; }
  if(d.moved){commit(); renderSel(); if(d.mode==='bg') renderLayers(); justDragged=true; setTimeout(()=>justDragged=false,0); return;}
  if(d.mode==='move'){ if(d.add&&d.was) select(d.id,true); else if(!d.add&&sels.size>1) select(d.id); }
}
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('click',e=>{ if(justDragged) return; if(!e.target.closest('[data-id],[data-handle]')&&sels.size) select(null); });
svg.addEventListener('touchstart',e=>{ if(multiMode||(e.target.closest&&e.target.closest('[data-id],[data-handle],[data-bg]'))) e.preventDefault(); },{passive:false});

/* ---------- actions ---------- */
function addItem(t,label,ex={}){
  const L=activeLayer();
  if(!L.vis||L.lock){toast(`「${L.name}」は${L.lock?'ロック中':'非表示'}です。解除するか別のレイヤーを選んでください`); return;}
  const it=mk(t,label,doc.W/2,doc.D/2,ex); it.layer=L.id;
  const s=sel&&get(sel);
  if(s&&s.t===it.t&&(t==='player'||t==='standing')){const a=rad(s.r||0), step=s.w+30; it.x=Math.round(s.x+Math.cos(a)*step); it.y=Math.round(s.y+Math.sin(a)*step); it.r=s.r;}
  else { const c=cond(); if(c&&(t==='player')) it.r=faceAngle(it.x,it.y,c.x,c.y); }
  doc.items.push(it); commit(); select(it.id);
  toast(`${label||T[t].n} を「${L.name}」に追加`); renderLayers();

function center(its){const xs=its.map(i=>i.x), ys=its.map(i=>i.y); return [(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2];}
function act(a){
  const its=selItems(); if(!its.length) return;
  const many=its.length>1;
  if(a==='rotL'||a==='rotR'){const d=a==='rotL'?-15:15;
    if(many){const [cx,cy]=center(its), t=rad(d), c=Math.cos(t), sn=Math.sin(t);
      its.forEach(i=>{const x=i.x-cx,y=i.y-cy; i.x=Math.round(cx+x*c-y*sn); i.y=Math.round(cy+x*sn+y*c); i.r=norm((i.r||0)+d);});}
    else its[0].r=norm((its[0].r||0)+d);}
  else if(a==='face'){const c=cond(); if(!c){toast('指揮台がありません'); return;} its.forEach(i=>{if(i!==c) i.r=faceAngle(i.x,i.y,c.x,c.y);});}
  else if(a==='dup'){const ns=its.map(i=>Object.assign(clone(i),{id:uid(),x:i.x+30,y:i.y+30})); doc.items.push(...ns); commit(); selectMany(ns.map(n=>n.id)); renderStage(); return;}
  else if(a==='del'){const set=new Set(its); doc.items=doc.items.filter(i=>!set.has(i)); clearSel(); commit(); draw(); renderSel(); renderStage(); toast(`${its.length>1?its.length+'個を':''}削除しました（戻す で復元）`); return;}
  else if(a==='front'){const set=new Set(its); doc.items=[...doc.items.filter(i=>!set.has(i)),...its];}
  else if(a==='back'){const set=new Set(its); doc.items=[...its,...doc.items.filter(i=>!set.has(i))];}
  else if(a==='alignH'){const y=Math.round(its.reduce((s,i)=>s+i.y,0)/its.length); its.forEach(i=>i.y=y);}
  else if(a==='alignV'){const x=Math.round(its.reduce((s,i)=>s+i.x,0)/its.length); its.forEach(i=>i.x=x);}
  else if(a==='distH'){const o=[...its].sort((p,q)=>p.x-q.x), x0=o[0].x, x1=o[o.length-1].x; o.forEach((i,k)=>i.x=Math.round(x0+(x1-x0)*k/(o.length-1)));}
  else if(a==='arc'){const c=cond(); if(!c){toast('指揮台がありません'); return;}
    const o=its.filter(i=>i!==c).map(i=>({i,a:Math.atan2(i.x-c.x,-(i.y-c.y)),r:Math.hypot(i.x-c.x,i.y-c.y)})).sort((p,q)=>p.a-q.a);
    if(o.length<2) return; const R=o.reduce((s,v)=>s+v.r,0)/o.length, a0=o[0].a, a1=o[o.length-1].a;
    o.forEach((v,k)=>{const t=a0+(a1-a0)*k/(o.length-1); v.i.x=Math.round(c.x+R*Math.sin(t)); v.i.y=Math.round(c.y-R*Math.cos(t)); v.i.r=faceAngle(v.i.x,v.i.y,c.x,c.y);});}
  else if(a==='same'){const l=its[0].label; selectMany(doc.items.filter(i=>editable(i)&&i.label===l).map(i=>i.id)); return;}
  else if(a==='all'){selectMany(doc.items.filter(i=>i.layer===doc.active&&editable(i)).map(i=>i.id)); return;}
  else if(a==='none'){select(null); return;}
  else if(a==='edit'){tab('sel'); return;}
  else if(a==='dir'){openDir(); return;}
  else if(a==='part'){openPart(); return;}
  commit(); draw(); renderSel(); renderStage();
}

function loadBg(f){
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image(); im.onload=()=>{
      const M=2000, k=Math.min(1,M/Math.max(im.width,im.height)), c=document.createElement('canvas');
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
      setBgSrc(c.toDataURL('image/jpeg',.82));
      const ar=c.height/c.width, w=doc.W;
      doc.bg={x:0,y:Math.round((doc.D-w*ar)/2),w,ar,op:.6,vis:true,lock:false};
      commit(); draw(); renderLayers(); toast('背景画像を読み込みました。ドラッグで位置を合わせられます');};
    im.onerror=()=>toast('この画像は読み込めませんでした。JPGかPNGを選んでください');
    im.src=rd.result;};
  rd.readAsDataURL(f);
}

function dl(blob,name){const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);}

function exportImg(){
  $('#nameWarn').hidden=!($('#oNames').checked&&doc.items.some(i=>i.name&&i.name.trim()));

  const r=stageSvg(P,{names:$('#oNames').checked,counts:$('#oCounts').checked,bg:$('#oBg').checked});
  const src=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="${r.vb}" width="${r.vw}" height="${r.vh}">${r.s}</svg>`;
  const img=new Image(), scale=Math.min(3,2400/r.vw);
  img.onload=()=>{const c=document.createElement('canvas'); c.width=Math.round(r.vw*scale); c.height=Math.round(r.vh*scale);

    const out=$('#outImg'); out.src=c.toDataURL('image/png'); out._canvas=c;};

  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault(); e.shiftKey?redo():undo(); return;}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault(); redo(); return;}
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet(); return;}
  if(e.key==='Escape'&&aimMode){aimMode=false; svg.style.cursor=''; toast('キャンセルしました'); return;}
  if(!$('#sheet').hidden) return;
  if(e.key==='Escape'){ if(!$('#ov').hidden) $('#ov').hidden=true; else if(sels.size) select(null); return;}
  if(mod&&e.key.toLowerCase()==='a'){e.preventDefault(); act('all'); return;}
  const it=sel&&get(sel); if(!it) return;
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault(); act('dup'); return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault(); act('del'); return;}
  if(e.key==='r'||e.key==='R'){act(e.shiftKey?'rotL':'rotR'); return;}
  const st=e.shiftKey?50:10, mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(mv){e.preventDefault(); selItems().forEach(i=>{i.x+=mv[0]; i.y+=mv[1];}); commit(); draw(); renderSel();}
});

  <li>動作や表示の正確さは保証できません。本番の配置は、会場や関係者と必ず確認してください。</li>
  <li>不具合や「こうしてほしい」は <a class="fbLink" href="${FEEDBACK_URL}" target="_blank" rel="noopener">ご意見フォーム</a> からどうぞ。</li></ul></div>`;
const GUIDE=[
  {t:'まずはステージを用意',b:['「ステージ」タブで吹奏楽・オーケストラ・バンドのプリセットを読み込むか、「空のステージ」から始めます。','間口と奥行はm単位で変えられます。目盛りはセンターからの距離です。','「追加」タブで奏者や楽器をタップすると、ステージに置かれます。パート未定の奏者を置いて、あとから「パート」で選ぶこともできます。']},
  {t:'動かす・そろえる',b:['ドラッグで移動、黄色い丸をドラッグで回転。','Shift／Ctrl＋クリックや、何もないところのドラッグで複数選択。スマホは右上の「複数選択」をオンにしてタップ／なぞります。','「向き」で方向をそろえたり、指揮者や好きな点に向けたりできます。複数選んで「指揮者を中心に弧に並べる」も便利です。']},
  {t:'レイヤーと背景',b:['「レイヤー」タブで平台・楽器・奏者などを分けて作業できます。鍵マークでロックすると動かなくなります。','ホールの舞台平面図の画像を背景に敷いて、位置と大きさを合わせられます。','ホールの図面は配布元の資料です。ホールの外へ配ったり公開したりするときは扱いに注意してください。']},
  {t:'保存と共有',b:['配置はこの端末のブラウザに自動保存されます。ほかの人とは共有されません。','ブラウザの履歴やキャッシュを消すと保存も消えます。大事な配置は「保存」タブの「データをコピー」でメモなどに控えておいてください。','「画像にする」で黒ステージか印刷向けの白を選んで画像にできます。','奏者名（生徒の名前など）が入った画像は、SNSや誰でも見られる場所には載せないでください。']}
];
let gStep=0;
function renderGuide(){
  const g=GUIDE[gStep], last=gStep===GUIDE.length-1;
  $('#guideBody').innerHTML=`<div class="row" style="align-items:center"><span class="step">${gStep+1} / ${GUIDE.length}</span><span style="flex:1"></span><button id="gSkip">閉じる</button></div>
    <h2 id="gTitle">${g.t}</h2><ul>${g.b.map(x=>`<li>${x}</li>`).join('')}</ul>
    ${last?ABOUT:''}
    <div class="row" style="align-items:center"><div class="dots">${GUIDE.map((_,i)=>`<i class="${i===gStep?'on':''}"></i>`).join('')}</div><span style="flex:1"></span>
      ${gStep?'<button id="gPrev">戻る</button>':''}<button id="gNext" class="primary">${last?'はじめる':'次へ'}</button></div>`;
  $('#gSkip').onclick=closeGuide; if($('#gPrev')) $('#gPrev').onclick=()=>{gStep--; renderGuide();};
  $('#gNext').onclick=()=>{if(last) closeGuide(); else {gStep++; renderGuide();}};
  $('#gNext').focus();
}
function openGuide(){gStep=0; $('#guide').hidden=false; renderGuide();}
function closeGuide(){$('#guide').hidden=true; try{localStorage.setItem('bamiri.guided','1')}catch(e){}}
$('#helpBtn').onclick=openGuide;
$('#guide').addEventListener('click',e=>{if(e.target.id==='guide') closeGuide();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#guide').hidden){closeGuide(); e.stopImmediatePropagation();}},true);

renderAdd(); renderAll(); updHist();
{let seen=null; try{seen=localStorage.getItem('bamiri.guided')}catch(e){} if(!seen) openGuide();}

/* ---------- 任意アンケートのお願い（回数はこの端末にだけ記録し、どこにも送りません） ---------- */
const SV=(()=>{const d=LS.get('bamiri.survey')||{}; return Object.assign({visits:0,exports:0,state:'',next:3},d);})();
SV.visits++; LS.set('bamiri.survey',SV);
function svSave(){LS.set('bamiri.survey',SV);}
function svMaybe(){
  if(SV.state==='done'||SV.state==='never') return;
  if(!$('#guide').hidden||!$('#ov').hidden) return;
  if(SV.visits>=SV.next||SV.exports>=2) $('#survey').hidden=false;
}
function svDone(){SV.state='done'; svSave(); $('#survey').hidden=true;}
$('#svGo').onclick=()=>{svDone(); toast('ありがとうございます！');};
$('#svLink2').onclick=()=>{svDone();};
$('#svLater').onclick=()=>{SV.next=SV.visits+3; SV.exports=-99; svSave(); $('#survey').hidden=true;};
$('#svNever').onclick=()=>{SV.state='never'; svSave(); $('#survey').hidden=true;};
$('#ovClose').addEventListener('click',()=>setTimeout(svMaybe,400));
$('#exportBtn').addEventListener('click',()=>{SV.exports++; svSave();});
setTimeout(svMaybe,1500);
setZoom(matchMedia('(max-width:820px)').matches?1.8:1);
})();
</script>
